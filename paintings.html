<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paintings — Youcy Huang</title>
  <meta name="description" content="Catalogue of paintings by Youcy Huang — fifteen years of practice organized by period.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>山</text></svg>">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">Youcy Huang</a>
  <ul class="nav-links">
    <li><a href="paintings.html" class="active">Paintings</a></li>
    <li><a href="writing.html">Writing</a></li>
    <li><a href="digital.html">Digital</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>

<main class="page">
  <div class="page-inner">

    <!-- Toolbar -->
    <div class="catalog-toolbar">
      <h1>Catalogue of Paintings</h1>
      <div class="catalog-controls">
        <label>Thumbnail Size</label>
        <input type="range" id="size-slider" min="150" max="320" value="210" oninput="Paintings.resize(this.value)">
        <span style="font-family:var(--sans);font-size:.6rem;color:var(--muted);min-width:36px" id="size-label">210px</span>
      </div>
    </div>

    <!-- Periods rendered by JS -->
    <div id="catalogue"></div>

  </div>
</main>

<!-- Annotation Panel -->
<div class="ann-panel" id="ann-panel">
  <button class="ann-close" onclick="Paintings.closeAnn()">Close ×</button>
  <h3 id="ann-title"></h3>
  <p class="meta" id="ann-meta"></p>
  <textarea id="ann-text" placeholder="Write your annotation for this work..."></textarea>
  <button class="save-btn" onclick="Paintings.saveAnn()">Save</button>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close">Close</button>
  <img src="" alt="">
</div>

<script src="assets/js/paintings.js"></script>
</body>
</html>
