<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — Youcy Huang</title>
  <meta name="description" content="Writing by Youcy Huang — critical essays, fiction, and poetry. Click to read full texts.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>山</text></svg>">
  <style>
    /* Writing-page specific */
    .doc-item{cursor:pointer;padding:.8rem 0;border-bottom:1px solid var(--rule-light);transition:background .15s}
    .doc-item:hover{background:var(--warm)}
    .doc-item .doc-title{font-weight:600;font-size:.95rem;display:block;margin-bottom:2px}
    .doc-item .doc-desc{font-family:var(--serif);font-style:italic;font-size:.78rem;color:var(--ink-light);font-weight:300}
    .doc-item .doc-year{font-family:var(--sans);font-size:.58rem;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;display:block;margin-top:2px}
    .doc-item .expand-hint{font-family:var(--sans);font-size:.55rem;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
    .doc-item.open{background:var(--warm)}

    /* Full text area */
    .doc-full{display:none;padding:0 0 1rem 0}
    .doc-item.open .doc-full{display:block}
    .doc-full .editor{
      width:100%;min-height:300px;border:1px solid var(--rule-light);
      background:var(--cream);font-family:var(--serif);font-size:.9rem;
      line-height:1.9;padding:1rem;resize:vertical;outline:none;
      white-space:pre-wrap;word-wrap:break-word;
    }
    .doc-full .editor:focus{border-color:var(--ink)}
    .doc-full .editor-toolbar{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:.5rem;
    }
    .doc-full .save-indicator{
      font-family:var(--sans);font-size:.55rem;color:var(--muted);letter-spacing:.04em;
    }
    .doc-full .word-count{
      font-family:var(--sans);font-size:.55rem;color:var(--faint);letter-spacing:.04em;
    }

    /* Search */
    .search-toggle{
      position:fixed;right:1.5rem;bottom:2rem;
      width:44px;height:44px;border-radius:50%;
      background:var(--ink);color:var(--cream);border:none;
      font-family:var(--serif);font-size:1.2rem;cursor:pointer;
      box-shadow:0 2px 12px rgba(0,0,0,.12);z-index:80;
      display:flex;align-items:center;justify-content:center;
    }
    .search-overlay{display:none;position:fixed;inset:0;z-index:150;background:rgba(250,250,247,.97)}
    .search-overlay.on{display:flex;flex-direction:column;align-items:center;padding-top:8rem}
    .search-overlay input{width:100%;max-width:560px;padding:1rem 1.2rem;border:none;border-bottom:1px solid var(--rule);background:transparent;font-family:var(--serif);font-size:1.5rem;outline:none;text-align:center}
    .search-overlay input:focus{border-bottom-color:var(--ink)}
    .search-overlay .results{max-width:560px;width:100%;margin-top:2rem;max-height:50vh;overflow-y:auto}
    .search-overlay .close-btn{position:absolute;top:1.5rem;right:1.5rem;font-family:var(--sans);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer}

    @media(max-width:700px){
      .search-overlay input{font-size:1.1rem;padding:.8rem}
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">Youcy Huang</a>
  <ul class="nav-links">
    <li><a href="paintings.html">Paintings</a></li>
    <li><a href="writing.html" class="active">Writing</a></li>
    <li><a href="digital.html">Digital</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>

<main class="page">
  <div class="page-inner">

    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2.5rem;">
      <div>
        <h2 style="margin-bottom:.3rem;">Writing</h2>
        <p style="color:var(--ink-light);font-size:.85rem;">Click any title to expand and read the full text. All texts are editable — changes save in your browser.</p>
      </div>
    </div>

    <!-- A: Critical Essays -->
    <div class="writing-cat" style="margin-bottom:2.5rem;">
      <h4 style="margin-bottom:1rem;">A. Critical Essays</h4>
      <div id="cat-essays"><!-- JS fills --></div>
    </div>

    <!-- B: Fiction -->
    <div class="writing-cat" style="margin-bottom:2.5rem;">
      <h4 style="margin-bottom:1rem;">B. Fiction</h4>
      <div id="cat-fiction"><!-- JS fills --></div>
    </div>

    <!-- C: Poetry -->
    <div class="writing-cat" style="margin-bottom:2.5rem;">
      <h4 style="margin-bottom:1rem;">C. Poetry</h4>
      <div id="cat-poetry"><!-- JS fills --></div>
    </div>

  </div>
</main>

<!-- Search FAB + Overlay -->
<button class="search-toggle" onclick="Writing.openSearch()" title="Search">⌕</button>

<div class="search-overlay" id="search-overlay">
  <button class="close-btn" onclick="Writing.closeSearch()">Close ✕</button>
  <input type="text" id="search-input" placeholder='Search by time, theme, or keyword...' oninput="Writing.search(this.value)">
  <div class="results" id="search-results"></div>
</div>

<footer class="footer"><p>Youcy Huang &copy; 2026 &nbsp;·&nbsp; youcyhuang@proton.me</p></footer>
<script src="assets/js/writing.js"></script>
</body>
</html>
